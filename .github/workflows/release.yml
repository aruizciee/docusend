name: Build y Release

# Solo se publica una release cuando se pide expresamente:
#   - manualmente desde la pestaña Actions ("Run workflow"), o
#   - al subir una etiqueta con el formato vAAAA.MM.DD-N (p. ej. v2026.11.16-1).
# Un push normal a main ya NO publica nada.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar tag de version
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $date = Get-Date -Format "yyyy.MM.dd"
            $run  = "${{ github.run_number }}"
            $tag  = "v$date-$run"
          }
          # El actualizador compara versiones con este formato; otro formato
          # haria que los usuarios no recibieran el aviso de actualizacion.
          if ($tag -notmatch '^v\d{4}\.\d{2}\.\d{2}-\d+$') {
            Write-Error "La etiqueta '$tag' no tiene el formato vAAAA.MM.DD-N"
            exit 1
          }
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          [System.IO.File]::WriteAllText("version.py", "VERSION = `"$tag`"`n", [System.Text.UTF8Encoding]::new($false))

      - name: Compilar ejecutable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --collect-all customtkinter `
            --runtime-tmpdir "%TEMP%" `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            docusend.py

      - name: Crear Release y subir .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Release ${{ steps.version.outputs.TAG }}"
          generate_release_notes: true
          body: |
            **Commit:** ${{ github.sha }}
          files: dist/docusend.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
